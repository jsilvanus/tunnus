name: publish-image
# Manual: builds the Docker image and pushes it to GitHub Container Registry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag, e.g. 0.1.0 (the commit SHA tag is always added)'
        required: false
        default: ''
      latest:
        description: 'Also move the "latest" tag'
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${GITHUB_SHA::7}"
          [ -n "${{ inputs.tag }}" ] && tags="$tags,$image:${{ inputs.tag }}"
          [ "${{ inputs.latest }}" = "true" ] && tags="$tags,$image:latest"
          echo "list=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
