name: publish-image
# Builds the Docker image and pushes it to GitHub Container Registry.
# Runs on version tags (v1.2.3) and on manual dispatch.
# A tag v1.2.3 publishes 1.2.3, 1.2, sha-<short> and moves latest. A pre-release tag
# (v1.2.3-rc.1) publishes 1.2.3-rc.1 and sha-<short> only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag, e.g. 0.1.0 (the commit SHA tag is always added)'
        required: false
        default: ''
      latest:
        description: 'Also move the "latest" tag'
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.latest == true || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
