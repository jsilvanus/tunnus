openapi: 3.1.0
info:
  title: Tunnus Service Discovery & Registry API
  version: 1.0.0
  description: |
    Central Service Discovery and Catalog contract for Riihimäen seurakunta applications,
    APIs, and edge Pi-ecosystem instances.

    Managed within Tunnus, serving two primary interfaces:
    1. Public / Consumer Discovery API (`/api/v1/discovery`): Flat list and filtered queries
       for client applications (such as Canva plugin, web apps, signage clients).
    2. Admin Management API (`/admin/api/v1/services`): Full CRUD for parish administrators
       and AI agents via `tunnus` CLI and `tunnus-mcp`.
  license:
    name: EUPL-1.2

servers:
  - url: '{issuer}'
    variables:
      issuer:
        default: https://tunnus.riihimaenseurakunta.fi

paths:
  # ============================================================================
  # 1. CLIENT DISCOVERY ENDPOINTS (Consumer / Frontend / Plugins)
  # ============================================================================

  /api/v1/discovery:
    get:
      operationId: getDiscoveryServices
      summary: Discover active services and endpoints
      description: |
        Returns active services registered in the parish catalog.
        Clients can optionally filter by service `type`, `venue`, or requested `capability`.
      security: []  # Public or optionally Bearer authenticated
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by service type (e.g. `piprogram`, `pigateway`, `signage`, `anno`)
          schema:
            type: string
        - name: venue
          in: query
          required: false
          description: Filter by venue or location (e.g. `keskuskirkko`, `kappeli`, `parish-wide`)
          schema:
            type: string
        - name: capability
          in: query
          required: false
          description: Filter by required capability (e.g. `slides`, `export_target`, `camera_control`)
          schema:
            type: string
      responses:
        '200':
          description: List of discovered services matching the criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
              example:
                updated_at: '2026-11-25T17:45:00Z'
                services:
                  - id: keskuskirkko-piprogram
                    name: Keskuskirkko — Sali (Pi Program)
                    type: piprogram
                    venue: keskuskirkko
                    endpoint_url: https://kehitys.riihimaenseurakunta.fi/canva
                    url: https://kehitys.riihimaenseurakunta.fi/canva
                    auth:
                      type: api_key
                      header_name: X-API-Key
                    capabilities: [slides, stage_display, export_target]
                    metadata:
                      pipeline: primary
                      export_targets:
                        - id: sali-valkokangas-16-9
                          name: Pääsalin valkokangas (16:9)
                          category: slides
                          aspect_ratio: "16:9"
                          resolution: { width: 1920, height: 1080 }
                          formats: [png, jpeg]
                          multi_page: true
                          ingest:
                            path: /api/v1/pipgm/items
                  - id: sissi-signage
                    name: Kyltti / Sissi Infonäytöt
                    type: signage
                    venue: parish-wide
                    endpoint_url: https://kehitys.riihimaenseurakunta.fi/sissi
                    url: https://kehitys.riihimaenseurakunta.fi/sissi
                    auth:
                      type: oidc
                      client_id: canva-sissi-publisher
                      scopes: [signage:write]
                    capabilities: [screen_push, playlist_management, export_target]
                    metadata:
                      export_targets:
                        - id: keskuskirkko-aula-portrait
                          name: Keskuskirkon eteisaula (Pysty 9:16)
                          category: signage
                          aspect_ratio: "9:16"
                          resolution: { width: 1080, height: 1920 }
                          formats: [png, jpeg, mp4]
                          multi_page: false
                          ingest:
                            path: /api/screens/keskuskirkko-aula/content
        default:
          $ref: '#/components/responses/Error'

  /api/v1/discovery/{type}:
    get:
      operationId: getDiscoveryServicesByType
      summary: Discover services by specific type
      description: Shortcut to list only services belonging to a specific type (e.g. `/api/v1/discovery/piprogram`).
      security: []
      parameters:
        - name: type
          in: path
          required: true
          description: Service type name
          schema:
            type: string
        - name: venue
          in: query
          required: false
          description: Optional venue filter
          schema:
            type: string
      responses:
        '200':
          description: Filtered service list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
        default:
          $ref: '#/components/responses/Error'

  # ============================================================================
  # 2. OIDC CLIENT SELF-REGISTRATION ENDPOINTS
  # ============================================================================

  /api/v1/discovery/services/{serviceId}:
    get:
      operationId: getDiscoveryServiceById
      summary: Get details of a single discovered service
      description: Returns active service information by service ID.
      security: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Discovered service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredService'
        default:
          $ref: '#/components/responses/Error'

    put:
      operationId: putClientDiscoveryService
      summary: Self-register or update a service
      description: |
        Allows an authenticated OIDC client to register or update its own service in the parish catalog.
        The service is bound to `owner_client_id = clientId`. If the service already exists, only its
        owning client or a master administrator may update it.
      security:
        - clientBasicAuth: []
        - clientHeaderAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientServicePutInput'
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredService'
        '201':
          description: Service self-registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredService'
        '401':
          description: Missing or invalid client credentials
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: 'Basic realm="Service Discovery Registration"'
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error'
        '403':
          description: Forbidden (service owned by another client or client disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteClientDiscoveryService
      summary: Deregister / delete an owned service
      description: Deregisters a service previously created by this OIDC client.
      security:
        - clientBasicAuth: []
        - clientHeaderAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Service deregistered successfully
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: Forbidden (service owned by another client)
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/discovery/services/{serviceId}/heartbeat:
    post:
      operationId: touchClientDiscoveryHeartbeat
      summary: Service liveness heartbeat
      description: Updates `updated_at` to now(), signaling that the service is alive and healthy.
      security:
        - clientBasicAuth: []
        - clientHeaderAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [ok, updated_at]
                properties:
                  ok:
                    type: boolean
                    example: true
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'

  # ============================================================================
  # 3. ADMIN REGISTRY MANAGEMENT (CLI, Admin API & MCP)
  # ============================================================================

  /admin/api/v1/services:
    get:
      operationId: listAdminServices
      x-tunnus-cli: services list
      summary: List all registered services in catalog
      description: Lists all services including disabled and maintenance services.
      security:
        - adminToken: []
      parameters:
        - name: include_disabled
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: venue
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of registered services
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Error'

    post:
      operationId: createAdminService
      x-tunnus-cli: services create
      summary: Register a new service endpoint
      description: Adds a new application or Pi-service endpoint to the central discovery catalog.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateInput'
      responses:
        '201':
          description: Service successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Error'

  /admin/api/v1/services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        description: Unique slug ID of the service (e.g. `keskuskirkko-piprogram`)
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    get:
      operationId: getAdminService
      x-tunnus-cli: services get
      summary: Get details of a registered service
      security:
        - adminToken: []
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Error'

    put:
      operationId: putAdminService
      x-tunnus-cli: services put
      summary: Create or replace a registered service
      description: Idempotent create or replace.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateInput'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Error'

    patch:
      operationId: updateAdminService
      x-tunnus-cli: services update
      summary: Update fields of a registered service
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateInput'
      responses:
        '200':
          description: Updated service record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        default:
          $ref: '#/components/responses/Error'

    delete:
      operationId: deleteAdminService
      x-tunnus-cli: services delete
      x-tunnus-destructive: true
      summary: Delete a registered service from catalog
      security:
        - adminToken: []
      responses:
        '204':
          description: Service deleted
        default:
          $ref: '#/components/responses/Error'

# ==============================================================================
# COMPONENTS & SCHEMAS
# ==============================================================================

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Opaque Tunnus admin token (`tun_...`)
    clientBasicAuth:
      type: http
      scheme: basic
      description: OIDC Client credentials (client_id:client_secret)
    clientHeaderAuth:
      type: apiKey
      in: header
      name: X-Client-Id
      description: OIDC Client credentials via X-Client-Id and X-Client-Secret headers

  responses:
    Error:
      description: Standard API error shape
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            additionalProperties: false
            properties:
              error:
                type: string
                example: not_found
              message:
                type: string
                example: Service not found

  schemas:
    DiscoveryResponse:
      type: object
      required: [updated_at, services]
      additionalProperties: false
      properties:
        updated_at:
          type: string
          format: date-time
          description: Timestamp of latest catalog modification
        services:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredService'

    DiscoveredService:
      type: object
      required: [id, name, type, venue, endpoint_url]
      additionalProperties: false
      properties:
        id:
          type: string
          example: keskuskirkko-piprogram
        name:
          type: string
          example: Keskuskirkko — Sali (Pi Program)
        type:
          type: string
          example: piprogram
        venue:
          type: string
          example: keskuskirkko
        endpoint_url:
          type: string
          format: uri
          example: https://kehitys.riihimaenseurakunta.fi/canva
        url:
          type: string
          format: uri
          description: Alias to endpoint_url for client convenience
          example: https://kehitys.riihimaenseurakunta.fi/canva
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        capabilities:
          type: array
          items: { type: string }
          example: [slides, stage_display, export_target]
        metadata:
          type: object
          additionalProperties: true
        owner_client_id:
          type: string
          nullable: true
          description: OIDC client identifier that owns/registered this service
          example: client-sissi

    ServiceAuth:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [none, api_key, bearer, oidc]
          example: api_key
        client_id:
          type: string
          description: OIDC client identifier if auth type is oidc
          example: canva-pieco-app
        scopes:
          type: array
          items: { type: string }
          example: [program:write]
        audience:
          type: string
          example: https://keskuskirkko.riihimaenseurakunta.fi
        header_name:
          type: string
          description: Header name for api_key or custom bearer tokens
          example: X-API-Key

    Service:
      type: object
      required: [id, name, type, venue, endpoint_url, disabled, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          example: keskuskirkko-piprogram
        name:
          type: string
          example: Keskuskirkko — Sali (Pi Program)
        type:
          type: string
          example: piprogram
        venue:
          type: string
          example: keskuskirkko
        endpoint_url:
          type: string
          format: uri
        url:
          type: string
          format: uri
          description: Alias to endpoint_url
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        owner_client_id:
          type: string
          nullable: true
          description: OIDC client identifier that owns/registered this service
          example: client-sissi
        disabled:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceCreateInput:
      type: object
      required: [id, name, type, venue, endpoint_url]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          example: keskuskirkko-piprogram
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Keskuskirkko — Sali (Pi Program)
        type:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
          example: piprogram
        venue:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
          example: keskuskirkko
        endpoint_url:
          type: string
          format: uri
          example: https://kehitys.riihimaenseurakunta.fi/canva
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        owner_client_id:
          type: string
          nullable: true
          description: OIDC client identifier that owns/registered this service
          example: client-sissi
        disabled:
          type: boolean
          default: false

    ClientServicePutInput:
      type: object
      required: [name, type, venue, endpoint_url]
      additionalProperties: false
      description: Payload for OIDC client self-registering or updating its service
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Kyltti / Sissi Infonäytöt
        type:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
          example: signage
        venue:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
          example: parish-wide
        endpoint_url:
          type: string
          format: uri
          example: https://kehitys.riihimaenseurakunta.fi/sissi
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        capabilities:
          type: array
          items: { type: string }
          example: [screen_push, playlist_management, export_target]
        metadata:
          type: object
          additionalProperties: true
        disabled:
          type: boolean
          default: false

    ServiceUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        venue:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        endpoint_url:
          type: string
          format: uri
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        owner_client_id:
          type: string
          nullable: true
          description: OIDC client identifier that owns/registered this service
          example: client-sissi
        disabled:
          type: boolean

    ExportTarget:
      type: object
      required: [id, name, category, aspect_ratio, resolution, formats, ingest]
      additionalProperties: true
      description: |
        Publishing and export target specifications for Canva, web publishers, and signage.
        Located under `service.metadata.export_targets` in flattened array form.
      properties:
        id:
          type: string
          example: sali-valkokangas-16-9
        name:
          type: string
          example: Pääsalin valkokangas (16:9)
        category:
          type: string
          enum: [slides, signage, broadcast, print, web, social]
          example: slides
        aspect_ratio:
          type: string
          example: "16:9"
        resolution:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
              example: 1920
            height:
              type: integer
              example: 1080
            pixel_ratio:
              type: number
              default: 1
              example: 1
            dpi:
              type: integer
              default: 72
              example: 72
        formats:
          type: array
          items:
            type: string
            enum: [png, jpeg, webp, mp4, pdf, svg]
          example: [png, jpeg]
        multi_page:
          type: boolean
          default: false
          description: Whether target accepts multiple pages/slides (e.g. PiProgram) or strictly single image/video (e.g. Sissi signage).
          example: true
        alpha_channel:
          type: boolean
          default: false
          description: Requires transparent background (e.g. ATEM downstream key graphics).
          example: false
        ingest:
          $ref: '#/components/schemas/ExportIngestSpec'
        prefill_rules:
          type: object
          properties:
            extract_text:
              type: boolean
              default: false
              description: Whether to extract and pre-fill headline and body text from design elements.
              example: true
            field_mapping:
              type: object
              additionalProperties: { type: string }
              example:
                heading: title
                body: description

    ExportIngestSpec:
      type: object
      description: |
        Ingest specification for posting export packages.
        If `url` is an absolute URL (https://...), use directly.
        If `path` is relative (/api/v1/...), resolve against service root:
          const uploadUrl = target.ingest.url ? target.ingest.url : new URL(target.ingest.path, service.endpoint_url || service.url).toString();
        Service auth (e.g. api_key or oidc) is inherited from parent service.auth unless overridden in this ingest spec.
      properties:
        url:
          type: string
          format: uri
          description: Absolute ingest URL (overrides parent service URL)
        path:
          type: string
          description: Relative path resolved against parent service URL
          example: /api/v1/pipgm/items
        method:
          type: string
          enum: [POST, PUT]
          default: POST
          example: POST
        content_type:
          type: string
          default: multipart/form-data
          example: multipart/form-data
        field_name:
          type: string
          default: files
          example: files
        auth:
          $ref: '#/components/schemas/ServiceAuth'
          description: Optional override if different from parent service auth
