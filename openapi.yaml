openapi: 3.1.0
info:
  title: Tunnus admin API
  version: 1.0.0
  description: |
    Administration API for Tunnus, served at `<issuer>/admin/api/v1`.

    Every operation needs an admin token (`Authorization: Bearer tun_...`).
    Tokens are opaque, stored only as a hash, expire, and belong to a user
    with `is_admin`. There is no cookie authentication. Every authenticated
    call writes an audit event naming the token's user.

    This file is the contract: the server registers one route per
    `operationId`, validates requests (and, in tests, responses) against it,
    and the CLI and MCP server are generated from it.

    Extensions on operations:
    - `x-tunnus-cli` is the CLI command (`tunnus users list`).
    - `x-tunnus-destructive: true` marks operations that cannot be undone.
      The MCP server leaves them out and the CLI asks for confirmation.
    - `x-tunnus-mcp: false` leaves an operation out of the MCP server for
      another reason (admin token values must not pass through an AI
      client's context).
  license:
    name: EUPL-1.2
servers:
  - url: '{issuer}/admin/api/v1'
    variables:
      issuer:
        default: https://id.example.org
security:
  - adminToken: []
tags:
  - name: me
  - name: admin-tokens
  - name: users
  - name: groups
  - name: memberships
  - name: keys
  - name: audit
  - name: clients
  - name: services

paths:
  /me:
    get:
      operationId: getMe
      x-tunnus-cli: whoami
      tags: [me]
      summary: The admin user and token making this call
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  /admin-tokens:
    get:
      operationId: listAdminTokens
      x-tunnus-cli: tokens list
      tags: [admin-tokens]
      summary: List admin tokens
      description: Lists active tokens (not revoked, not expired) unless `include_inactive` is true. Token values are never returned.
      parameters:
        - name: user_id
          x-tunnus-user-reference: true
          in: query
          schema: { type: string, format: uuid }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminToken' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAdminToken
      x-tunnus-cli: tokens create
      x-tunnus-mcp: false
      tags: [admin-tokens]
      summary: Create an admin token
      description: The token value is in the response only once. Without `user_id` the token is for the caller; `user_id` must name an active admin user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminTokenCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminTokenCreated' }
        default: { $ref: '#/components/responses/Error' }

  /admin-tokens/{tokenId}:
    parameters:
      - { $ref: '#/components/parameters/TokenId' }
    delete:
      operationId: revokeAdminToken
      x-tunnus-cli: tokens revoke
      x-tunnus-mcp: false
      tags: [admin-tokens]
      summary: Revoke an admin token
      description: Idempotent; revoking an already revoked token returns 204.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }

  /users:
    get:
      operationId: listUsers
      x-tunnus-cli: users list
      tags: [users]
      summary: List users, ordered by email
      parameters:
        - name: q
          x-tunnus-sensitive-user-search: true
          in: query
          description: Case-insensitive substring of email, display name or title
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: name
          x-tunnus-sensitive-user-search: true
          in: query
          description: Case-insensitive substring of display name
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: title
          x-tunnus-sensitive-user-search: true
          in: query
          description: Case-insensitive substring of title
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: email
          x-tunnus-sensitive-user-search: true
          in: query
          description: Exact email address (case-insensitive)
          schema: { type: string, minLength: 1, maxLength: 254 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: is_admin
          in: query
          schema: { type: boolean }
        - name: group_id
          in: query
          description: Exact group membership (group ID or unique group name)
          schema: { $ref: '#/components/schemas/GroupRef' }
        - name: group_prefix
          in: query
          description: Membership in the exact group or any descendant group (slash-boundary aware)
          schema: { $ref: '#/components/schemas/GroupName' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      x-tunnus-cli: users create
      tags: [users]
      summary: Create a user
      description: Any email address is allowed (sign-up rules do not apply). The user joins the default groups.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      operationId: getUser
      x-tunnus-cli: users get
      tags: [users]
      summary: Get a user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateUser
      x-tunnus-cli: users update
      tags: [users]
      summary: Update email, display name, status or admin flag
      description: |
        Setting `status` to `disabled` ends the user's sessions, revokes their
        grants and refresh tokens, and revokes their admin tokens. Removing
        `is_admin` revokes their admin tokens. A change that would leave no
        active admin fails with `409 last_admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteUser
      x-tunnus-cli: users delete
      tags: [users]
      summary: Delete a user
      description: Ends sessions, revokes tokens and removes the user row and memberships. Audit rows keep only the user id. Deleting the last active admin fails with `409 last_admin`.
      x-tunnus-destructive: true
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /users/{userId}/revoke-sessions:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      operationId: revokeUserSessions
      x-tunnus-cli: users revoke-sessions
      tags: [users]
      summary: End all sessions and revoke all grants and tokens of a user
      description: The user can sign in again. Admin tokens are not affected.
      x-tunnus-destructive: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeResult' }
        default: { $ref: '#/components/responses/Error' }

  /users/{userId}/totp:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      operationId: enableUserTotp
      x-tunnus-cli: users enable-totp
      x-tunnus-mcp: false
      tags: [users]
      summary: Generate and enable TOTP for a user
      description: Generates a new TOTP secret for the user and returns it once.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpProvisionResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: disableUserTotp
      x-tunnus-cli: users disable-totp
      x-tunnus-mcp: false
      x-tunnus-destructive: true
      tags: [users]
      summary: Disable and clear TOTP for a user
      responses:
        '204': { description: Disabled }
        default: { $ref: '#/components/responses/Error' }

  /users/{userId}/groups:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    get:
      operationId: listUserGroups
      x-tunnus-cli: users groups
      tags: [memberships]
      summary: List a user's group memberships, ordered by group name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Error' }

  /groups:
    get:
      operationId: listGroups
      x-tunnus-cli: groups list
      tags: [groups]
      summary: List groups, ordered by name
      parameters:
        - name: name
          in: query
          description: Exact group name
          schema: { $ref: '#/components/schemas/GroupName' }
        - name: prefix
          in: query
          description: Exact group path or any descendant path (slash-boundary aware)
          schema: { $ref: '#/components/schemas/GroupName' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Group' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createGroup
      x-tunnus-cli: groups create
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}:
    parameters:
      - { $ref: '#/components/parameters/GroupId' }
    get:
      operationId: getGroup
      x-tunnus-cli: groups get
      tags: [groups]
      summary: Get a group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateGroup
      x-tunnus-cli: groups update
      tags: [groups]
      summary: Rename a group or change its description
      description: Default groups cannot be renamed (`409 default_group`); their description can change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteGroup
      x-tunnus-cli: groups delete
      tags: [groups]
      summary: Delete a group and its memberships
      description: Default groups cannot be deleted (`409 default_group`).
      x-tunnus-destructive: true
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}/members:
    parameters:
      - { $ref: '#/components/parameters/GroupId' }
    get:
      operationId: listGroupMembers
      x-tunnus-cli: groups members
      tags: [memberships]
      summary: List a group's members, ordered by email
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/GroupId' }
      - { $ref: '#/components/parameters/UserId' }
    put:
      operationId: grantMembership
      x-tunnus-cli: groups grant
      tags: [memberships]
      summary: Add a user to a group
      description: Idempotent. Returns 201 when the membership was created, 200 when it already existed (unchanged). The new `groups` claim applies at the user's next token refresh or sign-in.
      responses:
        '200':
          description: Already a member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeMembership
      x-tunnus-cli: groups revoke
      tags: [memberships]
      summary: Remove a user from a group
      description: Returns 404 `not_found` when the user is not a member.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Error' }

  /group-rules:
    get:
      operationId: listGroupRules
      x-tunnus-cli: group-rules list
      tags: [groups]
      summary: List group implication rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GroupRule' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createGroupRule
      x-tunnus-cli: group-rules add
      tags: [groups]
      summary: Create a group implication rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRuleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GroupRule'
                  - $ref: '#/components/schemas/GroupRuleBatch'
        default: { $ref: '#/components/responses/Error' }

  /group-rules/{ruleId}:
    delete:
      operationId: deleteGroupRule
      x-tunnus-cli: group-rules remove
      tags: [groups]
      summary: Delete a group implication rule
      parameters:
        - { $ref: '#/components/parameters/RuleId' }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Error' }

  /keys:
    get:
      operationId: listKeys
      x-tunnus-cli: keys list
      tags: [keys]
      summary: List signing keys, newest first
      parameters:
        - name: include_unpublished
          in: query
          description: Also list retired keys whose grace period has ended
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SigningKey' }
        default: { $ref: '#/components/responses/Error' }

  /keys/rotate:
    post:
      operationId: rotateKeys
      x-tunnus-cli: keys rotate
      tags: [keys]
      summary: Rotate signing keys
      description: |
        The `next` key becomes `active`, the old `active` key becomes
        `retired` and stays published in JWKS for the grace period
        (`KEY_RETIRED_GRACE_DAYS`), and a new `next` key is created. If no
        `next` key exists, one is created and promoted at once, and the
        response carries the warning `next_key_missing`.
      x-tunnus-destructive: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyRotation' }
        default: { $ref: '#/components/responses/Error' }

  /keys/{kid}/retire:
    parameters:
      - name: kid
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      operationId: retireKey
      x-tunnus-cli: keys retire
      tags: [keys]
      summary: Retire a key and remove it from JWKS now
      description: |
        For a `retired` key, ends its grace period now. For the `next` key,
        retires it unpublished and creates a new `next` key. The `active`
        key cannot be retired (`409 key_active`); rotate first.
      x-tunnus-destructive: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKey' }
        default: { $ref: '#/components/responses/Error' }

  /audit-events:
    get:
      operationId: listAuditEvents
      x-tunnus-cli: audit list
      tags: [audit]
      summary: List audit events, newest first
      parameters:
        - name: action
          in: query
          description: Exact action, or a prefix ending in `*` (for example `admin.*`)
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: actor_user_id
          x-tunnus-user-reference: true
          in: query
          schema: { type: string, format: uuid }
        - name: target_type
          in: query
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: target_id
          x-tunnus-sensitive-user-search: true
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: since
          in: query
          description: Inclusive lower bound on `at`
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Exclusive upper bound on `at`
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        default: { $ref: '#/components/responses/Error' }

  /clients:
    get:
      operationId: listClients
      x-tunnus-cli: clients list
      tags: [clients]
      summary: List registered OIDC clients
      description: Client secrets are never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
        default: { $ref: '#/components/responses/Error' }

  /clients/{clientId}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    get:
      operationId: getClient
      x-tunnus-cli: clients get
      tags: [clients]
      summary: Get an OIDC client
      description: Client secrets are never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putClient
      x-tunnus-cli: clients put
      tags: [clients]
      summary: Create or replace an OIDC client
      description: |
        Idempotent. When creating a confidential client without `client_secret`,
        a random secret is generated and returned once (`201`). Replacing without
        `client_secret` keeps the existing secret (`200`). File-seeded clients
        (`source: file`) return `409 client_managed_by_file` until adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPut' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '201':
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClientWithSecret'
                  - $ref: '#/components/schemas/Client'
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateClient
      x-tunnus-cli: clients update
      tags: [clients]
      summary: Update an OIDC client
      description: Partial metadata update or `disabled` toggle. `client_secret` cannot be set here; use `clients rotate-secret`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteClient
      x-tunnus-cli: clients delete
      tags: [clients]
      summary: Delete an OIDC client and revoke its tokens
      description: Deletes an API-managed client and revokes all of its grants, tokens, and authorization codes. File-seeded clients return `409 client_managed_by_file`.
      x-tunnus-destructive: true
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /clients/{clientId}/secret:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    post:
      operationId: rotateClientSecret
      x-tunnus-cli: clients rotate-secret
      tags: [clients]
      summary: Rotate an OIDC client secret
      description: 'Sets the given `client_secret` or generates a new random secret (returned once). Pass `revoke_tokens: true` to revoke existing grants and tokens.'
      x-tunnus-destructive: true
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientRotateSecret' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSecretRotated' }
        default: { $ref: '#/components/responses/Error' }

  /clients/{clientId}/adopt:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
    post:
      operationId: adoptClient
      x-tunnus-cli: clients adopt
      tags: [clients]
      summary: Adopt a file-seeded client for API management
      description: 'Changes a `CLIENTS_FILE`-seeded client (`source: file`) to API management (`source: api`). Idempotent if already `api`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        default: { $ref: '#/components/responses/Error' }

  /services:
    get:
      operationId: listServices
      x-tunnus-cli: services list
      tags: [services]
      summary: List registered discovery services
      description: Lists services registered in the discovery catalog.
      parameters:
        - name: include_disabled
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          schema: { type: string }
        - name: venue
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createService
      x-tunnus-cli: services create
      tags: [services]
      summary: Create a discovery service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }

  /services/{serviceId}:
    parameters:
      - { $ref: '#/components/parameters/ServiceId' }
    get:
      operationId: getService
      x-tunnus-cli: services get
      tags: [services]
      summary: Get a discovery service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putService
      x-tunnus-cli: services put
      tags: [services]
      summary: Create or replace a discovery service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateService
      x-tunnus-cli: services update
      tags: [services]
      summary: Update a discovery service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteService
      x-tunnus-cli: services delete
      x-tunnus-destructive: true
      tags: [services]
      summary: Delete a discovery service
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Opaque admin token, `tun_` followed by 43 base64url characters

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID or email address
      schema: { $ref: '#/components/schemas/UserRef' }
    GroupId:
      name: groupId
      in: path
      required: true
      description: Group numeric ID or unique group name
      schema: { $ref: '#/components/schemas/GroupRef' }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      description: OIDC client identifier
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: Unique service identifier
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page
      schema: { type: string, minLength: 1, maxLength: 500 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code: `invalid_request` (400),
                `unauthorized` (401), `forbidden` (403), `not_found` (404),
                `conflict`, `last_admin`, `default_group`, `key_active`,
                `client_managed_by_file` (409),
                `rate_limited` (429), `internal` (500).
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, message]
                additionalProperties: false
                properties:
                  path: { type: string }
                  message: { type: string }

    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; null on the last page

    Timestamp:
      type: string
      format: date-time

    NullableTimestamp:
      type: [string, 'null']
      format: date-time

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254

    DisplayName:
      type: string
      minLength: 1
      maxLength: 200

    UserStatus:
      type: string
      enum: [active, disabled]

    GroupName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\p{L}\p{N}][\p{L}\p{N}._:@*-]*(/[\p{L}\p{N}][\p{L}\p{N}._:@*-]*)*$'
      description: Unicode letters and digits, `.`, `_`, `-`, `:`, `@`, `*`; `/` separates segments; no leading or trailing slash. Each segment starts with a letter or digit. Names are literal strings; `*` and `@` have no meaning to Tunnus itself.

    UserRef:
      x-tunnus-user-reference: true
      description: Open mode accepts a user UUID or email. Restricted MCP modes accept typed pseudonyms and/or temporary references only.
      oneOf:
        - type: string
          format: uuid
        - $ref: '#/components/schemas/Email'

    GroupRef:
      description: Group numeric ID or unique group name
      anyOf:
        - type: integer
          minimum: 1
        - $ref: '#/components/schemas/GroupName'

    User:
      x-tunnus-user-record: true
      type: object
      required:
        [
          id,
          email,
          display_name,
          status,
          is_admin,
          created_at,
          last_login_at,
          last_email_verified_at,
          totp_enabled,
          groups,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: The OIDC `sub` }
        email: { $ref: '#/components/schemas/Email' }
        display_name: { type: string }
        title: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        is_admin: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_login_at: { $ref: '#/components/schemas/NullableTimestamp' }
        last_email_verified_at: { $ref: '#/components/schemas/NullableTimestamp' }
        activates_at: { $ref: '#/components/schemas/NullableTimestamp' }
        disables_at: { $ref: '#/components/schemas/NullableTimestamp' }
        disabled_at: { $ref: '#/components/schemas/NullableTimestamp' }
        totp_enabled: { type: boolean }
        groups:
          type: array
          description: Group names, sorted
          items: { type: string }

    TotpProvisionResult:
      type: object
      required: [secret, otpauth_uri]
      additionalProperties: false
      properties:
        secret: { type: string }
        otpauth_uri: { type: string }

    UserCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        display_name:
          $ref: '#/components/schemas/DisplayName'
          description: Defaults to a name derived from the email local part
        title: { type: string, maxLength: 200 }
        phone_number: { type: string, maxLength: 100 }
        activates_at: { $ref: '#/components/schemas/NullableTimestamp' }
        disables_at: { $ref: '#/components/schemas/NullableTimestamp' }
        is_admin: { type: boolean, default: false }
        groups:
          type: array
          description: Additional groups (names or IDs) to add the user to
          items: { $ref: '#/components/schemas/GroupRef' }

    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        display_name: { $ref: '#/components/schemas/DisplayName' }
        title: { type: string, maxLength: 200, nullable: true }
        phone_number: { type: string, maxLength: 100, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        activates_at: { $ref: '#/components/schemas/NullableTimestamp' }
        disables_at: { $ref: '#/components/schemas/NullableTimestamp' }
        is_admin: { type: boolean }

    RevokeResult:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked:
          type: integer
          minimum: 0
          description: Number of sessions, grants and tokens removed

    Group:
      type: object
      required: [id, name, description, is_default, member_count]
      additionalProperties: false
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        is_default: { type: boolean, description: Listed in DEFAULT_GROUPS }
        member_count: { type: integer, minimum: 0 }

    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/GroupName' }
        description: { type: string, maxLength: 500, default: '' }
        members:
          type: array
          description: Initial members (user UUIDs or email addresses) to add to the group
          items: { $ref: '#/components/schemas/UserRef' }

    GroupUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/GroupName' }
        description: { type: string, maxLength: 500 }

    Membership:
      x-tunnus-membership-record: true
      type: object
      required: [user_id, email, display_name, group_id, group_name, granted_by, granted_at]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          x-tunnus-user-id: true
        email: { type: string }
        display_name: { type: string }
        group_id: { type: integer }
        group_name: { type: string }
        granted_by:
          type: [string, 'null']
          format: uuid
          x-tunnus-user-id: true
          description: Admin who granted it; null for default groups joined at sign-up
        granted_at: { $ref: '#/components/schemas/Timestamp' }

    GroupRule:
      type: object
      required:
        [id, source_group_id, source_group_name, implied_group_id, implied_group_name, created_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        source_group_id: { type: integer }
        source_group_name: { type: string }
        implied_group_id: { type: integer }
        implied_group_name: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    GroupRuleCreate:
      type: object
      additionalProperties: false
      properties:
        source_group:
          type: string
          minLength: 1
          maxLength: 200
          description: Source group name or ID
        source_groups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Source group names or IDs
        implied_group:
          type: string
          minLength: 1
          maxLength: 200
          description: Implied group name or ID
        implied_groups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Implied group names or IDs

    GroupRuleBatch:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupRule' }

    AdminToken:
      type: object
      required: [id, user_id, label, created_at, created_by, expires_at, last_used_at, revoked_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          x-tunnus-user-id: true
        label: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        created_by:
          type: [string, 'null']
          format: uuid
          x-tunnus-user-id: true
          description: Null for tokens made by `tunnus-admin bootstrap`
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { $ref: '#/components/schemas/NullableTimestamp' }
        revoked_at: { $ref: '#/components/schemas/NullableTimestamp' }

    AdminTokenCreate:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
        user_id: { type: string, format: uuid }

    AdminTokenCreated:
      type: object
      description: An AdminToken plus the token value, which is shown only in this response
      required:
        [id, user_id, label, created_at, created_by, expires_at, last_used_at, revoked_at, token]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        created_by: { type: [string, 'null'], format: uuid }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { $ref: '#/components/schemas/NullableTimestamp' }
        revoked_at: { $ref: '#/components/schemas/NullableTimestamp' }
        token:
          type: string
          pattern: '^tun_[A-Za-z0-9_-]{43}$'

    Me:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { $ref: '#/components/schemas/AdminToken' }

    SigningKey:
      type: object
      required:
        [
          kid,
          alg,
          status,
          created_at,
          activated_at,
          retired_at,
          published_until,
          published,
          public_jwk,
        ]
      additionalProperties: false
      properties:
        kid: { type: string }
        alg: { type: string }
        status: { type: string, enum: [next, active, retired] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        activated_at: { $ref: '#/components/schemas/NullableTimestamp' }
        retired_at: { $ref: '#/components/schemas/NullableTimestamp' }
        published_until:
          $ref: '#/components/schemas/NullableTimestamp'
          description: For retired keys, when they leave JWKS
        published: { type: boolean, description: Currently in JWKS }
        public_jwk:
          type: object
          description: Public JWK (never the private key)
          required: [kty, kid]
          properties:
            kty: { type: string }
            kid: { type: string }

    KeyRotation:
      type: object
      required: [active, next, retired, warnings]
      additionalProperties: false
      properties:
        active: { $ref: '#/components/schemas/SigningKey' }
        next: { $ref: '#/components/schemas/SigningKey' }
        retired: { $ref: '#/components/schemas/SigningKey' }
        warnings:
          type: array
          items: { type: string, enum: [next_key_missing] }

    AuditEvent:
      type: object
      required: [id, at, actor_user_id, action, target_type, target_id, ip, details]
      additionalProperties: false
      properties:
        id: { type: string, description: Monotonic id (bigint as string) }
        at: { $ref: '#/components/schemas/Timestamp' }
        actor_user_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        target_type: { type: [string, 'null'] }
        target_id: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        details: { type: object }

    Client:
      type: object
      required:
        [
          client_id,
          redirect_uris,
          post_logout_redirect_uris,
          token_endpoint_auth_method,
          grant_types,
          first_party,
          always_include_groups,
          source,
          disabled,
          secret_set_at,
          created_at,
          updated_at,
        ]
      additionalProperties: false
      properties:
        client_id: { type: string }
        source: { type: string, enum: [file, api] }
        disabled: { type: boolean }
        token_endpoint_auth_method:
          { type: string, enum: [client_secret_basic, client_secret_post, none] }
        first_party: { type: boolean }
        always_include_groups: { type: boolean }
        redirect_uris: { type: array, items: { type: string } }
        post_logout_redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        allowed_resources: { type: array, items: { type: string } }
        backchannel_logout_uri: { type: [string, 'null'] }
        backchannel_logout_session_required: { type: [boolean, 'null'] }
        id_token_signed_response_alg: { type: string }
        client_name: { type: [string, 'null'] }
        secret_set_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    ClientWithSecret:
      type: object
      description: A newly created Client plus the generated client_secret, shown only once
      required:
        [
          client_id,
          redirect_uris,
          post_logout_redirect_uris,
          token_endpoint_auth_method,
          grant_types,
          first_party,
          always_include_groups,
          source,
          disabled,
          secret_set_at,
          created_at,
          updated_at,
          client_secret,
        ]
      additionalProperties: false
      properties:
        client_id: { type: string }
        source: { type: string, enum: [file, api] }
        disabled: { type: boolean }
        token_endpoint_auth_method:
          { type: string, enum: [client_secret_basic, client_secret_post, none] }
        first_party: { type: boolean }
        always_include_groups: { type: boolean }
        redirect_uris: { type: array, items: { type: string } }
        post_logout_redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        allowed_resources: { type: array, items: { type: string } }
        backchannel_logout_uri: { type: [string, 'null'] }
        backchannel_logout_session_required: { type: [boolean, 'null'] }
        id_token_signed_response_alg: { type: string }
        client_name: { type: [string, 'null'] }
        secret_set_at: { $ref: '#/components/schemas/NullableTimestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        client_secret: { type: string }

    ClientSecretRotated:
      type: object
      required: [client_id, secret_set_at, revoked]
      additionalProperties: false
      properties:
        client_id: { type: string }
        secret_set_at: { $ref: '#/components/schemas/Timestamp' }
        client_secret:
          type: string
          description: Present only when the secret was generated; shown once
        revoked: { type: integer, minimum: 0 }

    ClientPut:
      type: object
      required: [redirect_uris]
      additionalProperties: false
      properties:
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        first_party: { type: boolean }
        always_include_groups: { type: boolean }
        allowed_resources:
          type: array
          items: { type: string }
        backchannel_logout_uri: { type: string }
        backchannel_logout_session_required: { type: boolean }
        id_token_signed_response_alg: { type: string }
        client_name: { type: string, minLength: 1, maxLength: 200 }
        client_secret:
          type: string
          minLength: 32
          description: Optional client secret (at least 32 characters). Generated on create if omitted for confidential clients.
        disabled:
          type: boolean
          default: false

    ClientUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        first_party: { type: boolean }
        always_include_groups: { type: boolean }
        allowed_resources:
          type: array
          items: { type: string }
        backchannel_logout_uri: { type: [string, 'null'] }
        backchannel_logout_session_required: { type: boolean }
        id_token_signed_response_alg: { type: string }
        client_name: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        disabled: { type: boolean }

    ClientRotateSecret:
      type: object
      additionalProperties: false
      properties:
        client_secret:
          type: string
          minLength: 32
          description: Optional new client secret (at least 32 characters). Generated if omitted.
        revoke_tokens:
          type: boolean
          default: false
          description: Revoke existing grants and tokens for this client

    ServiceAuth:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [none, api_key, bearer, oidc]
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        audience: { type: string }
        header_name: { type: string }

    Service:
      type: object
      required:
        [
          id,
          name,
          type,
          venue,
          endpoint_url,
          auth,
          capabilities,
          metadata,
          disabled,
          created_at,
          updated_at,
        ]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        venue: { type: string }
        endpoint_url: { type: string }
        url: { type: string }
        auth: { $ref: '#/components/schemas/ServiceAuth' }
        capabilities:
          type: array
          items: { type: string }
        metadata: { type: object }
        disabled: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    ServiceCreate:
      type: object
      required: [id, name, type, venue, endpoint_url]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        venue:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        endpoint_url: { type: string }
        auth: { $ref: '#/components/schemas/ServiceAuth' }
        capabilities:
          type: array
          items: { type: string }
        metadata: { type: object }
        disabled: { type: boolean }

    ServiceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        venue:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        endpoint_url: { type: string }
        auth: { $ref: '#/components/schemas/ServiceAuth' }
        capabilities:
          type: array
          items: { type: string }
        metadata: { type: object }
        disabled: { type: boolean }
